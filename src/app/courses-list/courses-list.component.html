
<div class="container mt-4">

  <h2>Courses</h2>

  <!-- Search -->
  <input
    class="form-control mb-3"
    placeholder="Search..."
    (input)="onSearch($event)"
  />

  <!-- Category Filters -->
  <div class="mb-3">

    <button
      class="btn me-2"
      [class.active]="selectedCategory === 'All'"
      (click)="filterByCategory('All')">
      All
    </button>

    <button
      class="btn me-2"
      [class.active]="selectedCategory === 'Frontend'"
      (click)="filterByCategory('Frontend')">
      Frontend
    </button>

    <button
      class="btn"
      [class.active]="selectedCategory === 'Backend'"
      (click)="filterByCategory('Backend')">
      Backend
    </button>

  </div>

  <!-- Courses Grid -->
  <div class="row mt-3">

    <div
      class="col-md-4 mb-3"
      *ngFor="let course of filteredCourses">

      <app-course-card
        [course]="course"
        (enroll)="onEnroll($event)">
      </app-course-card>

    </div>

  </div>

</div>
